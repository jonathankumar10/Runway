<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Runway</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 320px;
      background: #09090b;
      color: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
    }

    /* ── Header ─────────────────────────────────────────────────────────────── */

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .logo {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      background: linear-gradient(145deg, #111827, #312e81);
      border: 1px solid rgba(125, 211, 252, 0.35);
      border-radius: 8px;
      position: relative;
      overflow: hidden;
    }

    .logo::before {
      content: "";
      position: absolute;
      width: 17px;
      height: 3px;
      border-radius: 999px;
      background: #f8fafc;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-24deg);
      box-shadow: -6px 5px 0 -1px #7dd3fc, 7px -5px 0 -1px #7dd3fc;
    }

    .header-text h1 { font-size: 14px; font-weight: 700; color: #fafafa; }
    .header-text p  { font-size: 11px; color: #52525b; margin-top: 1px; }

    /* ── Signed-out ──────────────────────────────────────────────────────────── */

    .signed-out {
      padding: 20px 16px 16px;
    }

    .signed-out p {
      font-size: 12px;
      color: #71717a;
      line-height: 1.55;
      margin-bottom: 14px;
    }

    /* ── Signed-in ───────────────────────────────────────────────────────────── */

    .signed-in-body {
      padding: 14px 16px 0;
    }

    .user-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: #111827;
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .user-avatar {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      border-radius: 50%;
      background: linear-gradient(135deg, #312e81, #1d4ed8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
    }

    .user-meta { min-width: 0; }

    .user-label {
      font-size: 10px;
      color: #52525b;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 2px;
    }

    .user-email {
      font-size: 12px;
      color: #e2e8f0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── Buttons ─────────────────────────────────────────────────────────────── */

    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn:disabled { opacity: 0.65; cursor: default; }

    .btn-primary { background: #2563eb; color: #fff; }
    .btn-primary:hover:not(:disabled) { background: #1d4ed8; }

    .btn-open { background: #17b26a; color: #fff; margin-bottom: 14px; }
    .btn-open:hover { background: #15a460; }

    /* ── Site chips ──────────────────────────────────────────────────────────── */

    .sites-label {
      font-size: 10px;
      color: #3f3f46;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 7px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      padding-bottom: 14px;
    }

    .chip {
      font-size: 10px;
      color: #71717a;
      background: #18181b;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 999px;
      padding: 3px 8px;
    }

    /* ── Footer ──────────────────────────────────────────────────────────────── */

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .footer-version { font-size: 11px; color: #3f3f46; }

    .btn-signout {
      background: none;
      border: none;
      color: #52525b;
      font-size: 11px;
      cursor: pointer;
      padding: 0;
      transition: color 0.1s;
    }

    .btn-signout:hover { color: #a1a1aa; }

    /* ── Error ───────────────────────────────────────────────────────────────── */

    #error {
      font-size: 11px;
      color: #f87171;
      margin-top: 8px;
      text-align: center;
      min-height: 16px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo"></div>
    <div class="header-text">
      <h1>Runway</h1>
      <p>Job search assistant</p>
    </div>
  </div>

  <!-- Signed out -->
  <div id="signed-out" class="signed-out">
    <p>Sign in with the same Google account you use on Runway.</p>
    <button class="btn btn-primary" id="sign-in-btn">Sign in with Google</button>
    <div id="error"></div>
  </div>

  <!-- Signed in -->
  <div id="signed-in" style="display:none">
    <div class="signed-in-body">

      <div class="user-row">
        <div class="user-avatar" id="user-avatar">?</div>
        <div class="user-meta">
          <div class="user-label">Signed in as</div>
          <div class="user-email" id="user-email">—</div>
        </div>
      </div>

      <button class="btn btn-open" id="open-app-btn">Open Runway →</button>

      <div class="sites-label">Active on</div>
      <div class="chips">
        <span class="chip">LinkedIn</span>
        <span class="chip">Greenhouse</span>
        <span class="chip">Lever</span>
        <span class="chip">Ashby</span>
        <span class="chip">Workday</span>
        <span class="chip">Taleo</span>
        <span class="chip">iCIMS</span>
        <span class="chip">BambooHR</span>
        <span class="chip">SmartRecruiters</span>
        <span class="chip">Rippling</span>
        <span class="chip">Breezy HR</span>
        <span class="chip">Jobvite</span>
        <span class="chip">Recruitee</span>
      </div>

    </div>

    <div class="footer">
      <span class="footer-version">v1.1.1</span>
      <button class="btn-signout" id="sign-out-btn">Sign out</button>
    </div>
  </div>

  <script type="module" src="../dist/popup.js"></script>
</body>
</html>
