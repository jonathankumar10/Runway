<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Runway</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 280px;
      background: #0f172a;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 16px;
      border-bottom: 1px solid #1e293b;
    }
    .header-icon {
      width: 28px; height: 28px;
      background: #7c3aed;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
    }
    .header h1 { font-size: 14px; font-weight: 600; color: #fff; }
    .body { padding: 16px; }
    .status-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 12px;
    }
    .status-card .label { font-size: 10px; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
    .status-card .value { font-size: 13px; color: #e2e8f0; font-weight: 500; }
    .btn {
      width: 100%;
      padding: 9px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-primary { background: #7c3aed; color: #fff; }
    .btn-primary:hover { background: #6d28d9; }
    .btn-secondary { background: #1e293b; color: #94a3b8; margin-top: 6px; }
    .btn-secondary:hover { background: #334155; color: #e2e8f0; }
    .hint {
      font-size: 11px;
      color: #475569;
      text-align: center;
      margin-top: 10px;
      line-height: 1.5;
    }
    #error { font-size: 11px; color: #f87171; margin-top: 8px; text-align: center; min-height: 16px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-icon">✈</div>
    <h1>Runway</h1>
  </div>
  <div class="body">
    <div id="signed-out">
      <p class="hint" style="margin-bottom:12px; color:#94a3b8;">Sign in with the same Google account you use on Runway.</p>
      <button class="btn btn-primary" id="sign-in-btn">Sign in with Google</button>
      <div id="error"></div>
    </div>
    <div id="signed-in" style="display:none">
      <div class="status-card">
        <div class="label">Signed in as</div>
        <div class="value" id="user-email">—</div>
      </div>
      <p class="hint" style="margin-bottom:12px;">
        Visit a LinkedIn job posting to see <strong style="color:#a78bfa">✈ Add to Runway</strong>.<br/>
        Visit a recruiter profile to see <strong style="color:#a78bfa">✈ Track in Runway</strong>.
      </p>
      <button class="btn btn-secondary" id="sign-out-btn">Sign out</button>
    </div>
  </div>
  <script type="module" src="../dist/popup.js"></script>
</body>
</html>
